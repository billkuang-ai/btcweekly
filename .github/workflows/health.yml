name: Update Bitcoin Health Meter

on:
  schedule:
    - cron: "30 0 * * *"  # daily at 00:30 UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch health meter inputs
        run: node scripts/fetch-health-meter.js

      - name: Commit if changed
        run: |
          git config user.name "btcweekly-bot"
          git config user.email "bot@btcweekly.org"
          git add src/_data/health.json src/_data/health-history.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh health meter ($(date -u +%Y-%m-%d))"
            git push
          fi
